name: גיבוי יומי של הספרים

on:
  schedule:
    - cron: '17 1 * * *'   # כל יום ב-01:17 UTC (~03:17 בישראל)
  workflow_dispatch:        # אפשר להריץ ידנית מה-Actions

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: שליפת כל הספרים וכתיבת גיבוי
        run: node scripts/backup-books.mjs
      - name: רענון הקטלוג הציבורי (catalog.js) מ-Supabase
        run: node scripts/gen-catalog.mjs
        continue-on-error: true   # הגנה: אם המחולל עוצר (ייבוא חלקי) — הגיבוי עדיין נשמר
      - name: שמירת גיבוי + קטלוג מעודכן (commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/books-latest.json catalog.js
          if git diff --cached --quiet; then
            echo "אין שינוי — אין מה לשמור"
          else
            git commit -m "גיבוי ספרים + רענון קטלוג אוטומטי $(date -u +%Y-%m-%d)"
            git push
          fi
