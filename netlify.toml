[build]
  publish = "."
  functions = "netlify/functions"

# ביטול עיבוד/מזעור HTML של Netlify — מגיש את הקבצים כפי שהם
# (העיבוד הסיר את הקישור לתוכנת הניהול מה-HTML המוגש)
[build.processing]
  skip_processing = true

[[redirects]]
  from = "/api/save-content"
  to = "/.netlify/functions/save-content"
  status = 200

# דפי ספרים — פרוקסי ל-Cloudflare Worker תחת הדומיין של הספרייה
[[redirects]]
  from = "/book/*"
  to = "https://beityosef-books.aharonsystems.workers.dev/book/:splat"
  status = 200
  force = true
